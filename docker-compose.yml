version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mirrorconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mirrorconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mirrorconnect_db_pass_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-mirrorconnect}
    ports:
      - "55432:5432"
    volumes:
      - mirrorconnect-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mirrorconnect} -d ${POSTGRES_DB:-mirrorconnect}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  coturn:
    image: coturn/coturn:latest
    container_name: mirrorconnect-coturn
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./docker/coturn.conf:/etc/coturn/turnserver.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "turnutils_uclient -p 3478 -m 1 127.0.0.1 || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: mirrorconnect-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://mirrorconnect:mirrorconnect_db_pass_2026!@postgres:5432/mirrorconnect?schema=public}
      JWT_SECRET: ${JWT_SECRET:-ChangeThisToALongRandomJwtSecret2026!}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://mirror.yourdomain.com}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://mirror.yourdomain.com}
      SESSION_TTL_SECONDS: 300
      INACTIVITY_TIMEOUT_SECONDS: 120
      STUN_URL: ${STUN_URL:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:-turn:mirror.yourdomain.com:3478}
      TURN_USERNAME: ${TURN_USERNAME:-mirrorconnect}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-ChangeThisToASecureTurnPassword2026!}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://mirror.yourdomain.com}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://mirror.yourdomain.com}
    container_name: mirrorconnect-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: mirrorconnect-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - mirrorconnect-nginx-ssl:/etc/letsencrypt
      - mirrorconnect-certbot:/var/www/certbot
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mirrorconnect-postgres:
  mirrorconnect-coturn:
  mirrorconnect-nginx-ssl:
  mirrorconnect-certbot:
