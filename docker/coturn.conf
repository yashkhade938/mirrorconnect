# Coturn TURN/STUN Server Configuration for MirrorConnect
listening-port=3478
tls-listening-port=5349

# TURN Authentication & Security
fingerprint
lt-cred-mech
stale-nonce
no-cli

# Realm & Server Credentials (override via environment variables or volume mount)
realm=mirror.yourdomain.com
user=mirrorconnect:ChangeThisToASecureTurnPassword2026!

# Port Range for UDP/TCP Peer Relaying
min-port=49152
max-port=65535

# Logging & Performance
log-file=stdout
verbose

# External IP Binding (Set to host public IP in production)
# external-ip=YOUR_SERVER_PUBLIC_IP
